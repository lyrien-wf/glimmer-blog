server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

blog:
  jwt-secret: my-blog-jwt-secret-key-must-be-at-least-32-characters-long!!
  jwt-expire-hours: 72
  upload-dir: ./uploads
