server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

blog:
  jwt-secret: ${JWT_SECRET:my-blog-jwt-secret-key-must-be-at-least-32-characters-long!!}
  jwt-expire-hours: ${JWT_EXPIRE_HOURS:72}
  upload-dir: ${UPLOAD_DIR:./uploads}
